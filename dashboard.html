<!DOCTYPE html>
<html>
<head>
    <title>Trading Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0c10;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .card {
            background: #1a1d24;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2d34;
        }
        .price { font-size: 48px; font-weight: bold; color: #00ff88; }
        .btn-buy, .btn-sell {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        .btn-buy { background: #00ff88; color: #0a0c10; }
        .btn-sell { background: #ff4466; color: white; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-2 { margin-top: 10px; }
        .text-green { color: #00ff88; }
        .text-red { color: #ff4466; }
        .logout-btn {
            background: #ff4466;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2d34;
        }
        select, input {
            background: #0f1117;
            border: 1px solid #2a2d34;
            color: white;
            padding: 8px;
            border-radius: 6px;
        }
        .activity-log {
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
        }
        .activity-item {
            padding: 5px 0;
            border-bottom: 1px solid #2a2d34;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flex-between" style="margin-bottom: 20px;">
            <h1>🤖 AI Trading Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="card">
            <div class="price" id="price">$---</div>
            <div class="flex-between mt-2">
                <span>Spread: <span id="spread">--</span> pips</span>
                <span>Volume: <span id="volume-display">--</span></span>
            </div>
        </div>
        
        <div class="card">
            <h3>💰 Account</h3>
            <div class="stat-row"><span>Balance</span><span id="balance">$0.00</span></div>
            <div class="stat-row"><span>Equity</span><span id="equity">$0.00</span></div>
            <div class="stat-row"><span>AI Signal</span><span id="signal" class="text-green">HOLD</span></div>
        </div>
        
        <div class="card">
            <h3>🔴 Execute Trade</h3>
            <div class="flex-between">
                <select id="trade-volume">
                    <option>0.01</option>
                    <option selected>0.05</option>
                    <option>0.10</option>
                    <option>0.25</option>
                </select>
                <button class="btn-buy" id="buyBtn">BUY</button>
                <button class="btn-sell" id="sellBtn">SELL</button>
            </div>
        </div>
        
        <div class="card">
            <h3>📋 Activity</h3>
            <div id="log" class="activity-log"></div>
        </div>
    </div>
    
    <script>
        let socket = io();
        
        socket.on('market_update', (data) => {
            document.getElementById('price').innerHTML = `$${data.price.toFixed(2)}`;
            document.getElementById('spread').innerHTML = data.spread;
            document.getElementById('volume-display').innerHTML = data.volume;
            
            // Simple AI signal
            if (data.price > 2650) {
                document.getElementById('signal').innerHTML = 'BUY';
                document.getElementById('signal').style.color = '#00ff88';
            } else if (data.price < 2640) {
                document.getElementById('signal').innerHTML = 'SELL';
                document.getElementById('signal').style.color = '#ff4466';
            } else {
                document.getElementById('signal').innerHTML = 'HOLD';
                document.getElementById('signal').style.color = '#ffaa00';
            }
        });
        
        socket.on('trade_result', (data) => {
            addLog(`${data.action} ${data.volume} lots at $${data.price.toFixed(2)} | P&L: $${data.pnl.toFixed(2)}`);
            loadAccount();
        });
        
        async function loadAccount() {
            try {
            const res = await fetch('/api/account');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('balance').innerHTML = `$${data.balance.toFixed(2)}`;
                    document.getElementById('equity').innerHTML = `$${data.equity.toFixed(2)}`;
                }
            } catch(e) {}
        }
        
        async function executeTrade(action) {
            const volume = document.getElementById('trade-volume').value;
            try {
                const res = await fetch(`/api/trade/${action.toLowerCase()}?volume=${volume}`, { method: 'POST' });
                const data = await res.json();
                if (!data.success) addLog(`Order failed`);
            } catch(e) {
                addLog(`Error: ${e.message}`);
            }
        }
        
        function addLog(msg) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'activity-item';
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.insertBefore(div, log.firstChild);
            while(log.children.length > 30) log.removeChild(log.lastChild);
        }
        
        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }
        
        document.getElementById('buyBtn').onclick = () => executeTrade('BUY');
        document.getElementById('sellBtn').onclick = () => executeTrade('SELL');
        
        loadAccount();
        addLog('Dashboard ready');
    </script>
</body>
</html>
