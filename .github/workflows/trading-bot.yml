name: Trading Bot CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**.html'
      - 'requirements.txt'
      - '.github/workflows/*'
      - 'Procfile'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r requirements.txt

      - name: (Optional) Format code
        run: |
          black .
          isort .



      - name: Black check
        run: black --check --diff .

      - name: isort check
        run: isort --check-only --diff .

      - name: Flake8
        run: flake8 . --max-line-length=88


  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov fastapi

      - name: Run tests
        run: |
          pytest -q --disable-warnings --maxfail=1

  build:
    name: 📦 Build (sanity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: PyInstaller build (Linux)
        run: |
          pyinstaller --onefile --name trading-bot-linux main.py || true

